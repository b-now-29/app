spring:
  application:
    name: app
  jackson:
    deserialization:
      accept-float-as-int: false
    datatype:
      enum:
        # 숫자를 enum 순서(ordinal)로 해석하지 않는다. {"role": 1}이 ADMIN이 되는 것을 막는다
        fail-on-numbers-for-enums: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  # Caddy가 보낸 X-Forwarded-For를 Tomcat이 처리해 getRemoteAddr()가 클라이언트 IP가 된다
  forward-headers-strategy: native
app:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    cookie-secure: true
management:
  endpoints:
    web:
      exposure:
        include: health
