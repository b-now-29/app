spring:
  application:
    name: app
  jackson:
    deserialization:
      accept-float-as-int: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
app:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    cookie-secure: true
management:
  endpoints:
    web:
      exposure:
        include: health
