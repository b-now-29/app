services:
  app:
    image: ghcr.io/b-now-29/app:${APP_TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 서버의 .env에 설정하세요}
    depends_on:
      postgres:
        condition: service_healthy
    # Caddy는 b-now-29/infra에 있다. 외부 네트워크 edge로 app:8080을 찾는다. postgres는 edge에 붙이지 않는다.
    networks:
      - default
      - edge

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
    # ports 없음 → 외부에서 DB 접속 불가 (app만 내부 네트워크로 접속)

networks:
  edge:
    external: true

volumes:
  pgdata:
