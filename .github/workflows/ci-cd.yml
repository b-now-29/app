name: CI/CD

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

# 같은 브랜치에 새로 push하면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Gradle 의존성/빌드 캐시
      - uses: gradle/actions/setup-gradle@v5

      # npm 패키지 캐시 (package-lock.json이 바뀔 때만 새로 받음)
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('src/main/frontend/package-lock.json') }}

      # spotless + PMD + 단위 테스트 + 프론트 검사 + Testcontainers 테스트
      - run: ./gradlew check integrationTest

      # 실패하면 테스트 리포트를 내려받을 수 있게 올려둔다
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: build/reports/

  deploy:
    needs: check                     # CI 통과해야만 배포
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write                # GHCR에 이미지 push
    concurrency:
      group: deploy
      cancel-in-progress: false      # 배포 도중에는 취소하지 않음
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew bootJar -PwithDocs

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/b-now-29/app:latest
            ghcr.io/b-now-29/app:${{ github.sha }}

      - name: 서버에 배포
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          scp deploy/compose.yaml deploy/Caddyfile ec2-user@"$HOST":~/app/
          ssh ec2-user@"$HOST" "cd ~/app \
            && APP_TAG=${{ github.sha }} docker compose pull app \
            && APP_TAG=${{ github.sha }} docker compose up -d \
            && docker image prune -f"
