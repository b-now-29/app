name: CI

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop ]

# 같은 브랜치에 새로 push하면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Gradle 의존성/빌드 캐시
      - uses: gradle/actions/setup-gradle@v5

      # npm 패키지 캐시 (package-lock.json이 바뀔 때만 새로 받음)
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('src/main/frontend/package-lock.json') }}

      # spotless + PMD + 단위 테스트 + 프론트 검사 + Testcontainers 테스트
      - run: ./gradlew check integrationTest

      # 실패하면 테스트 리포트를 내려받을 수 있게 올려둔다
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: build/reports/
